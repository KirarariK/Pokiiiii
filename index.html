<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Pokiiiii — Idle Pokémon Gen I–IX</title>
    <meta
      name="description"
      content="Pokiiiii : idle Pokémon fan — 1025 espèces, combat 1v1, quêtes, pass journalier, toutes les régions."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;600;700;800&family=Sora:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://raw.githubusercontent.com" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/battle-bgs.css" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#0b0f1a" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%230f1b2e' stroke='%233b82f6' stroke-width='4'/%3E%3Cpath d='M4 32h56' stroke='%23f8fafc' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='8' fill='%23f5c518'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="app">
      <div class="loading">
        <div class="loading-orb" aria-hidden="true"></div>
        <span>Chargement Pokiiiii…</span>
      </div>
    </div>
    <script type="module" src="./js/main.js?v=820ee56"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('./sw.js?v=3')
            .then((reg) => {
              reg.update().catch(() => {});
              // Purge les vieux caches shell (v1/v2 gelaient main.js)
              if (navigator.serviceWorker.controller) {
                caches.keys().then((keys) =>
                  Promise.all(keys.filter((k) => k.startsWith('pokiiiii-shell-') && k !== 'pokiiiii-shell-v3').map((k) => caches.delete(k))),
                );
              }
            })
            .catch(() => {});
        });
      }
    </script>
  </body>
</html>
