<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Nindō — Forge ton chemin ninja</title>
    <meta
      name="description"
      content="Nindō : duels 1v1, collection de shinobi, kuchiyose, quêtes et sagas Konoha → Boruto. Un chemin unique — pas un clone poke-idle."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;600;700;800&family=Sora:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://s4.anilist.co" />
    <link rel="preconnect" href="https://static.wikia.nocookie.net" crossorigin />
    <link rel="stylesheet" href="./css/style.css?v=nindo1" />
    <link rel="stylesheet" href="./css/battle-bgs.css?v=nindo1" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#0a0705" />
    <link rel="icon" href="./assets/brand/nindo-icon-128.jpg" type="image/jpeg" />
  </head>
  <body>
    <div id="app">
      <div class="loading" id="boot-loading">
        <img class="loading-brand" src="./assets/brand/nindo-loading.jpg" alt="" width="88" height="88" />
        <span>Chargement Nindō…</span>
      </div>
    </div>
    <script type="module" src="./js/main.js?v=nindo1"></script>
    <script>
      (function () {
        const BOOT_MS = 10000;
        function showRescue(msg) {
          const app = document.getElementById('app');
          if (!app) return;
          if (app.querySelector('.pi-shell, .starter-screen, #title-root')) return;
          app.innerHTML =
            '<div class="loading" style="gap:1rem;padding:1.5rem;text-align:center">' +
            '<div class="loading-orb" aria-hidden="true"></div>' +
            '<strong style="color:#f97316">Chargement bloqué</strong>' +
            '<p style="color:#c4a484;max-width:22rem;margin:0 auto;font-size:.9rem">' +
            (msg || 'Le cache du navigateur empêche le démarrage.') +
            '</p>' +
            '<button type="button" id="boot-rescue" class="btn-primary" style="margin-top:.5rem">Vider le cache &amp; recharger</button>' +
            '</div>';
          document.getElementById('boot-rescue')?.addEventListener('click', async () => {
            try {
              const regs = await navigator.serviceWorker?.getRegistrations?.();
              if (regs) await Promise.all(regs.map((r) => r.unregister()));
              const keys = await caches.keys();
              await Promise.all(keys.map((k) => caches.delete(k)));
            } catch (_) {}
            location.reload();
          });
        }

        window.addEventListener('error', (e) => {
          if (String(e?.filename || '').includes('main.js') || String(e?.message || '').includes('Failed to fetch')) {
            showRescue('Erreur de script — vide le cache puis recharge.');
          }
        });
        window.addEventListener('unhandledrejection', () => {});

        setTimeout(() => {
          const app = document.getElementById('app');
          const stuck =
            app &&
            !app.querySelector('.pi-shell, .starter-screen, #title-root') &&
            /Chargement/i.test(app.innerText || '');
          if (stuck) showRescue('Toujours sur « Chargement… » — le service worker a probablement bloqué les fichiers.');
        }, BOOT_MS);

        if ('serviceWorker' in navigator) {
          window.addEventListener('load', () => {
            caches
              .keys()
              .then((keys) =>
                Promise.all(
                  keys
                    .filter(
                      (k) =>
                        k.startsWith('shinobiiii-shell-') ||
                        k.startsWith('pokiiiii-shell-') ||
                        (k.startsWith('nindo-shell-') && k !== 'nindo-shell-v1'),
                    )
                    .map((k) => caches.delete(k)),
                ),
              )
              .catch(() => {})
              .finally(() => {
                navigator.serviceWorker.register('./sw.js?v=nindo1').then((reg) => reg.update()).catch(() => {});
              });
          });
        }
      })();
    </script>
  </body>
</html>
