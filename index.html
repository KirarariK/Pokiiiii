<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Shinobiiii — Idle Naruto · Tous les ninja</title>
    <meta
      name="description"
      content="Shinobiiii : idle Naruto fan — tous les personnages & modes, combat 1v1, quêtes, invocations, sagas Konoha → Boruto."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;600;700;800&family=Sora:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://s4.anilist.co" />
    <link rel="preconnect" href="https://static.wikia.nocookie.net" crossorigin />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/battle-bgs.css" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#0a0705" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231a0c06'/%3E%3Cpath d='M32 8c8 12 16 16 16 28S40 56 32 56 16 48 16 36 24 20 32 8z' fill='none' stroke='%23f97316' stroke-width='4'/%3E%3Ccircle cx='32' cy='34' r='6' fill='%23fbbf24'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="app">
      <div class="loading" id="boot-loading">
        <div class="loading-orb" aria-hidden="true"></div>
        <span>Chargement Shinobiiii…</span>
      </div>
    </div>
    <script type="module" src="./js/main.js?v=naruto-img2"></script>
    <script>
      (function () {
        const BOOT_MS = 10000;
        function showRescue(msg) {
          const app = document.getElementById('app');
          if (!app) return;
          if (app.querySelector('.pi-shell, .starter-screen, #title-root')) return;
          app.innerHTML =
            '<div class="loading" style="gap:1rem;padding:1.5rem;text-align:center">' +
            '<div class="loading-orb" aria-hidden="true"></div>' +
            '<strong style="color:#f97316">Chargement bloqué</strong>' +
            '<p style="color:#c4a484;max-width:22rem;margin:0 auto;font-size:.9rem">' +
            (msg || 'Le cache du navigateur empêche le démarrage.') +
            '</p>' +
            '<button type="button" id="boot-rescue" class="btn-primary" style="margin-top:.5rem">Vider le cache &amp; recharger</button>' +
            '</div>';
          document.getElementById('boot-rescue')?.addEventListener('click', async () => {
            try {
              const regs = await navigator.serviceWorker?.getRegistrations?.();
              if (regs) await Promise.all(regs.map((r) => r.unregister()));
              const keys = await caches.keys();
              await Promise.all(keys.map((k) => caches.delete(k)));
            } catch (_) {}
            location.reload();
          });
        }

        window.addEventListener('error', (e) => {
          if (String(e?.filename || '').includes('main.js') || String(e?.message || '').includes('Failed to fetch')) {
            showRescue('Erreur de script — vide le cache puis recharge.');
          }
        });
        window.addEventListener('unhandledrejection', () => {});

        setTimeout(() => {
          const app = document.getElementById('app');
          const stuck =
            app &&
            !app.querySelector('.pi-shell, .starter-screen, #title-root') &&
            /Chargement/i.test(app.innerText || '');
          if (stuck) showRescue('Toujours sur « Chargement… » — le service worker a probablement bloqué les fichiers.');
        }, BOOT_MS);

        if ('serviceWorker' in navigator) {
          window.addEventListener('load', () => {
            caches
              .keys()
              .then((keys) =>
                Promise.all(
                  keys
                    .filter(
                      (k) =>
                        (k.startsWith('shinobiiii-shell-') || k.startsWith('pokiiiii-shell-')) &&
                        k !== 'shinobiiii-shell-v5',
                    )
                    .map((k) => caches.delete(k)),
                ),
              )
              .catch(() => {})
              .finally(() => {
                navigator.serviceWorker.register('./sw.js?v=5').then((reg) => reg.update()).catch(() => {});
              });
          });
        }
      })();
    </script>
  </body>
</html>
