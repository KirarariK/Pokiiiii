<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Pokiiiii — Idle Pokémon Gen I–IX</title>
    <meta
      name="description"
      content="Pokiiiii : idle Pokémon fan — 1025 espèces, combat 1v1, quêtes, pass journalier, toutes les régions."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;600;700;800&family=Sora:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://raw.githubusercontent.com" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/battle-bgs.css" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#0b0f1a" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%230f1b2e' stroke='%233b82f6' stroke-width='4'/%3E%3Cpath d='M4 32h56' stroke='%23f8fafc' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='8' fill='%23f5c518'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="app">
      <div class="loading" id="boot-loading">
        <div class="loading-orb" aria-hidden="true"></div>
        <span>Chargement Pokiiiii…</span>
      </div>
    </div>
    <script type="module" src="./js/main.js?v=ec9129d"></script>
    <script>
      (function () {
        // Si le SW bloque les modules, on se débloque tout seul
        const BOOT_MS = 10000;
        function showRescue(msg) {
          const app = document.getElementById('app');
          if (!app) return;
          if (app.querySelector('.pi-shell, .starter-screen, #title-root')) return;
          app.innerHTML =
            '<div class="loading" style="gap:1rem;padding:1.5rem;text-align:center">' +
            '<div class="loading-orb" aria-hidden="true"></div>' +
            '<strong style="color:#f5c518">Chargement bloqué</strong>' +
            '<p style="color:#8b9bb8;max-width:22rem;margin:0 auto;font-size:.9rem">' +
            (msg || 'Le cache du navigateur empêche le démarrage.') +
            '</p>' +
            '<button type="button" id="boot-rescue" class="btn-primary" style="margin-top:.5rem">Vider le cache &amp; recharger</button>' +
            '</div>';
          document.getElementById('boot-rescue')?.addEventListener('click', async () => {
            try {
              const regs = await navigator.serviceWorker?.getRegistrations?.();
              if (regs) await Promise.all(regs.map((r) => r.unregister()));
              const keys = await caches.keys();
              await Promise.all(keys.map((k) => caches.delete(k)));
            } catch (_) {}
            location.reload();
          });
        }

        window.addEventListener('error', (e) => {
          if (String(e?.filename || '').includes('main.js') || String(e?.message || '').includes('Failed to fetch')) {
            showRescue('Erreur de script — vide le cache puis recharge.');
          }
        });
        window.addEventListener('unhandledrejection', () => {
          /* ignore — boot() gère déjà */
        });

        setTimeout(() => {
          const app = document.getElementById('app');
          const stuck =
            app &&
            !app.querySelector('.pi-shell, .starter-screen, #title-root') &&
            /Chargement/i.test(app.innerText || '');
          if (stuck) showRescue('Toujours sur « Chargement… » — le service worker a probablement bloqué les fichiers.');
        }, BOOT_MS);

        if ('serviceWorker' in navigator) {
          window.addEventListener('load', () => {
            // Purge anciennes versions puis enregistre v4
            caches
              .keys()
              .then((keys) =>
                Promise.all(
                  keys
                    .filter((k) => k.startsWith('pokiiiii-shell-') && k !== 'pokiiiii-shell-v4')
                    .map((k) => caches.delete(k)),
                ),
              )
              .catch(() => {})
              .finally(() => {
                navigator.serviceWorker.register('./sw.js?v=4').then((reg) => reg.update()).catch(() => {});
              });
          });
        }
      })();
    </script>
  </body>
</html>
